# Remplacer candidatures.example.org et installer le certificat avant nginx -t.
server {
    listen 80;
    server_name candidatures.example.org;
    return 301 https://candidatures.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name candidatures.example.org;
    ssl_certificate /etc/letsencrypt/live/candidatures.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candidatures.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Autorise le fichier de 10 Mio et sa marge multipart, sans élargir Flask.
    client_max_body_size 12m;

    # Permet une maintenance avant de stopper les services pour sauvegarde/migration.
    if (-f /run/jobtracker-maintenance) {
        return 503;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    # Aucun alias vers /var/lib/jobtracker : les fichiers privés passent par Flask.
}
