{% extends "base.html" %}

{% block title %}Connexion - Job Tracker{% endblock %}

{% block content %}
<div class="page">

    <section class="edit-card">

        <div class="edit-card-header">
            <p class="eyebrow">ESPACE APPRENANT</p>

            <h1>Connexion</h1>

            <p class="subtitle">
                Accède à ton espace personnel de suivi
                des candidatures.
            </p>
        </div>

        {% include "partials/flash_messages.html" %}

        <form
            method="post"
            action="{{ url_for('auth.login') }}"
            class="edit-form"
        >
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="form-group">
                <label for="email">Adresse email</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="primary-button">
                    Se connecter
                </button>
            </div>
        </form>

    </section>

</div>
{% endblock %}
