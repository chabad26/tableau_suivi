{% extends "base.html" %}

{% block title %}
Modifier une boîte mail - Job Tracker
{% endblock %}

{% block content %}

<div class="page">

    <div class="detail-topbar">
        <a
            href="{{ url_for('connectors_page') }}"
            class="back-link"
        >
            ← Retour aux connecteurs
        </a>
    </div>

    <header class="header">

        <div>
            <p class="eyebrow">
                MESSAGERIE
            </p>

            <h1>
                Modifier la boîte mail
            </h1>

            <p class="subtitle">
                {{ account["email"] }}
            </p>
        </div>

    </header>

    {% include "partials/flash_messages.html" %}

    <section class="detail-card">

        <form
            method="post"
            action="{{ url_for(
                'update_imap_account_web',
                account_id=account['id']
            ) }}"
        >

            <div class="form-group">
                <label>
                    Adresse email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ account['email'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>
                    Fournisseur
                </label>

                <input
                    type="text"
                    name="provider"
                    value="{{ account['provider'] or '' }}"
                >
            </div>

            <div class="form-group">
                <label>
                    Serveur IMAP
                </label>

                <input
                    type="text"
                    name="host"
                    value="{{ account['host'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>
                    Port
                </label>

                <input
                    type="number"
                    name="port"
                    value="{{ account['port'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>
                    Identifiant
                </label>

                <input
                    type="text"
                    name="username"
                    value="{{ account['username'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>
                    Nouveau mot de passe
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Laisser vide pour conserver l'actuel"
                >
            </div>

            <div class="form-group">
                <label>
                    Dossier
                </label>

                <input
                    type="text"
                    name="folder"
                    value="{{ account['folder'] }}"
                    required
                >
            </div>

            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        name="use_ssl"
                        {% if account["use_ssl"] %}
                            checked
                        {% endif %}
                    >

                    SSL/TLS

                </label>

            </div>

            <button
                type="submit"
                class="primary-button"
            >
                Enregistrer les modifications
            </button>

        </form>

    </section>

</div>

{% endblock %}
