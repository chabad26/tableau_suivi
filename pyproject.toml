[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Certains imports historiques sont aussi utilisés comme API de compatibilité.
ignore = ["F401"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pyright]
include = ["app", "*.py", "typings"]
exclude = [".venv", "tests", "**/node_modules", "**/__pycache__", "**/.*"]
venvPath = "."
venv = ".venv"
stubPath = "typings"
typeCheckingMode = "basic"
